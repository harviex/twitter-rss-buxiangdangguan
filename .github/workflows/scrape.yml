name: Hourly scrape @buxiangdangguan

on:
  schedule:
    - cron: "5 * * * *"   # 每小时 5 分（错峰）
  workflow_dispatch:       # 手动触发
  push:
    branches: [main]

permissions:
  contents: write  # 需要 push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape tweets
        id: scrape
        run: python scrape_tweets.py

      - name: Generate RSS
        run: python generate_rss.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tweets.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Update tweets from @buxiangdangguan (${{ steps.scrape.outputs.new_count }} new)"
            git push
          else
            echo "No changes to commit"
          fi

  deploy:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 创建/切换到 gh-pages 分支
          git checkout -B gh-pages origin/gh-pages 2>/dev/null || git checkout --orphan gh-pages
          
          # 清空工作目录，只保留 feed.xml
          git rm -rf . 2>/dev/null || true
          
          # 从 main 分支恢复 feed.xml
          git checkout origin/main -- feed.xml
          
          # 提交并推送
          git add feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Deploy feed.xml from main"
            git push origin gh-pages
          else
            echo "No changes to deploy"
          fi