name: Hourly scrape @buxiangdangguan

on:
  schedule:
    - cron: "5 * * * *"   # 每小时 5 分（错峰）
  workflow_dispatch:       # 手动触发

permissions:
  contents: write  # 需要 push
  pages: write     # 需要部署 Pages
  id-token: write  # 需要 OIDC token

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape tweets
        id: scrape
        run: python scrape_tweets.py

      - name: Generate RSS
        run: python generate_rss.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tweets.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Update tweets from @buxiangdangguan (${{ steps.scrape.outputs.new_count }} new)"
            git push
          else
            echo "No changes to commit"
          fi

  deploy:
    needs: scrape
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4