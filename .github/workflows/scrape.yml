name: Hourly RSS - @BAIGUANXINGSHU

on:
  schedule:
    - cron: "5 * * * *"   # 每小时 5 分（错峰避开整点限流）
  workflow_dispatch:       # 手动触发
  push:
    branches: [main]

permissions:
  contents: write  # 需要 push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape tweets (fxtwitter RSS)
        id: scrape
        run: python scrape_tweets.py

      - name: Generate RSS
        run: python generate_rss.py

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tweets.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Update tweets from @BAIGUANXINGSHU"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Upload feed.xml artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-xml
          path: feed.xml
          retention-days: 1

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download feed.xml artifact
        uses: actions/download-artifact@v4
        with:
          name: feed-xml
          path: .

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Deploy feed.xml from main"
            git push origin gh-pages
          else
            echo "No changes to deploy"
          fi
