name: Hourly scrape @buxiangdangguan

on:
  schedule:
    - cron: "5 * * * *"   # 每小时 5 分（错峰）
  workflow_dispatch:       # 手动触发

permissions:
  contents: write  # 需要 push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Scrape tweets
        id: scrape
        run: python scrape_tweets.py

      - name: Generate RSS
        if: steps.scrape.outputs.new_count != '0'
        run: python generate_rss.py

      - name: Commit & Push
        if: steps.scrape.outputs.new_count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tweets.json feed.xml
          git commit -m "🤖 Add ${{ steps.scrape.outputs.new_count }} new tweet(s) from @buxiangdangguan"
          git push